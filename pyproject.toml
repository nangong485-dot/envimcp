[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "envimcp"
version = "0.1.0"
description = "MCP server exposing ENVI 5.2 headless ENVITask operators to AI agents"
requires-python = ">=3.10"
dependencies = [
  "mcp==2.3.0",
]

[project.optional-dependencies]
geo = ["gdal>=3.6", "rasterio>=1.3"]
dev = ["pytest>=7.4"]

[project.scripts]
envimcp = "envimcp.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: needs the local IDL/ENVI installation (deselect with -m 'not slow')"]
